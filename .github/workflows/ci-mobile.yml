name: CI - Mobile (React Native)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      
      - name: Install dependencies
        run: npm ci
      
      - name: Bootstrap packages
        run: npm run bootstrap
      
      - name: Install Pods
        run: cd apps/mobile/ios && pod install
      
      - name: Build iOS (simulator)
        run: npm run build:mobile:ios
      
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.sha }}
          path: apps/mobile/ios/build/
          retention-days: 7

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install dependencies
        run: npm ci
      
      - name: Bootstrap packages
        run: npm run bootstrap
      
      - name: Build Android APK
        run: npm run build:mobile:android
      
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/
          retention-days: 7
