name: CI - Desktop (Electron)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    
    strategy:
      matrix:
        include:
          - os: Windows
            runner: windows-latest
            output: '*.exe'
          - os: macOS
            runner: macos-latest
            output: '*.dmg'
          - os: Linux
            runner: ubuntu-latest
            output: '*.AppImage'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Bootstrap packages
        run: npm run bootstrap
      
      - name: Build Desktop
        run: npm run build:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ github.sha }}
          path: |
            apps/desktop/dist/${{ matrix.output }}
          retention-days: 7
